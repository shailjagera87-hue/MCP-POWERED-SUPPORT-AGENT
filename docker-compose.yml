
services:
  mcp-server:
    build: .
    command: python -m mcp_server.server
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mcp-server
    restart: unless-stopped
    environment:
      MCP_SERVER_URL: http://mcp-server:8001/mcp
